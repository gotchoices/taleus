stroc: '1.0'
language: en
title: Tally Testing and Evaluation Agreement
author: sereus.org
text: >-
  When invoked by a Tally, this Contract causes the resulting Agreement to be completely non-binding on the Parties regardless of the language that will follow.
  A Tally created with this Contract is solely for the purposes of testing and evaluation and no amounts mentioned are actually due or payable by either Party to the other.
  When using this Tally, the Parties are solely and individually responsible for disabling Lifts on the Tally by configuring the appropriate Trading Variables (i.e. Reward and Clutch of 1).
  Failure to do so on a production system where other binding Tallies are in use will likely result in a total loss of value from the resulting Lift(s)!
