# Derived from MyCHIPs contract/Ethics.yaml (published 2020-04-01), via the Stroc sample library.
# Revised for Taleus; dispute remedies moved to the Disputes_*.yaml clauses. Draft; not yet published.
stroc: '1.0'
language: en
title: Ethical Conduct
author: sereus.org
published: '2026-10-08'
text: >-
  The credits, or Chits, under this Agreement constitute a Pledge of Value, measured in the Denomination of the Tally, from the Issuer, to the Recipient, which shall be satisfied according to the terms established and cryptographically signed in the Tally.
  In order for such a Pledge to be a valid, and therefore enforceable, the following conditions must also be met:
sections:
  - title: Competency
    text: >-
      The Issuer is of such age and mental capacity to understand the obligations the Issuer is entering into.
  - title: Informed Consent
    text: >-
      Both parties are reasonably informed by the other as to all material terms of the transaction.
      This includes the nature and quality of the Product.
      It also includes the ability of the Issuer to provide the agreed upon Value within the agreed upon terms.
  - title: Severability
    text: >-
      If any portion of this Agreement is deemed to be unenforceable in any way, such portion shall be severed from the Agreement and the remaining portions shall remain in full force and effect.
  - title: Honor
    text: >-
      The debtor agrees to not excuse itself from honoring the Agreement by reason of bankruptcy or similar recourse, even though prevailing law may allow it.
  - title: Indemnity
    text: >-
      The Parties shall hold harmless sereus.org and the GotChoices Foundation, their owners and affiliates, and all authors of and contributors to the Taleus and Sereus software and protocols for any loss related to their use.
  - title: Chain of Honor
    text: >-
      The obligations related to good faith and honesty made by the Parties also extend to other parties they may be indirectly connected to.
      For example, it is a breach of this covenant to use a trading relationship under this Tally to defraud another party somewhere else on the Taleus network.
      Each Party agrees to cooperate with the other in the rectification of any fraud or loss that may occur in the course of trading on this Tally.
      This cooperation implies the assignment of contract rights, as applicable, so that any unduly harmed party may invoke the rights of each party along a chain of transactions in order to remedy a fraud or undue loss.
