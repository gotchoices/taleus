# Derived from MyCHIPs contract/Defaults.yaml (published 2020-04-01), via the Stroc sample library.
# Revised for Taleus. Draft; not yet published.
stroc: '1.0'
language: en
title: Contract Breaches and Conditions of Default
author: sereus.org
text: >-
  Any of the following actions by either Party constitutes a breach of this Agreement, thereby deeming that Party to be in Default.
sections:
  - title: Failure of Duty
    text: >-
      Failure to honor any of the obligations specified in this Agreement.
  - title: False Representation
    text: >-
      Making any representation in connection with the Tally that is factually untrue.
  - title: Failure to Complete
    text: >-
      Failure to complete a Credit Lift transaction previously committed to, due to intentional manipulation of software and/or the network.
  - title: Attempt to Cheat
    text: >-
      Failure to complete a Credit Lift honestly and in accordance with the Taleus protocol as published by sereus.org and demonstrated by its reference implementation.
  - title: Failure to Honor
    text: >-
      Failure to provide sufficient connections to accomplish necessary Credit Lifts, followed by failure to make a Recipient whole by alternative means.
