# Derived from MyCHIPs contract/Tally_Contract.yaml (published 2020-04-01, revised 2024-02-06), via the Stroc sample library. Revised for Taleus. Disputes go to court; see Tally_Contract_Arbitration.yaml for the other variant.
# Draft; not yet published.
stroc: '1.0'
language: en
title: Taleus Tally Agreement (Courts)
author: sereus.org
text: >-
  This written Contract is part of an Agreement by and between the Parties, with one Party hereinafter referred to as Foil Holder and the other as Stock Holder.
  The content identifier of this Contract has been recorded in a Taleus digital Tally which also contains other Data relevant to the Agreement.
  Tally Data includes details about the identities of the Parties, the Denomination and Credit Terms of the Tally, and digital signatures by the Parties attesting to their acceptance of this Agreement.
  This Contract also incorporates further documents by reference, by their content identifiers.
  All terms and conditions, including those recorded in the Tally itself, this document, and the other documents it references, together form the complete Tally Agreement between the Parties.
  This Contract governs the Tally for the life of the Tally and is not amended.
  What changes over that life is recorded on the Tally: the indebtedness between the Parties changes with each Chit, and the Credit Terms and Trading Variables each Party extends to the other may be revised by that Party by recording a new version, each version remaining in force until it expires as this Agreement provides.
  Entries so recorded are made under this Agreement, not amendments to it.
