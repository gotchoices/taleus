title: Taleus Tally Agreement
author: sereus.org
text: >-
  This written Contract is part of an Agreement by and between the Parties, with one Party hereinafter referred to as Foil Holder and the other as Stock Holder.
  The content identifier of this Contract has been recorded in a Taleus digital Tally which also contains other Data relevant to the Agreement.
  Tally Data includes details about the identities of the Parties, the Denomination and Credit Terms of the Tally, and digital signatures by the Parties attesting to their acceptance of this Agreement.
  This Contract also incorporates further documents by reference, by their content identifiers.
  All terms and conditions, including those contained in the Tally itself, this document, the other documents it references, and the communications between the Parties, together form the complete Tally Agreement between the Parties.
