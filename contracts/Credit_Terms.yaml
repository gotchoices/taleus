# Derived from MyCHIPs contract/Credit_Terms.yaml (published 2020-04-01), via the Stroc sample library.
# Revised for Taleus: terms named as in the Taleus schema (CreditLimit, CallDays); amounts in the Denomination;
# interest-related terms apply only when expressly stated. Draft; not yet published.
stroc: '1.0'
language: en
title: Credit Terms and Conditions
author: sereus.org
text: >-
  When executing a Tally Agreement, the Parties each decide the limits of Pledges of Value they will accept from the other Party.
  The Parties may also specify other terms and conditions that influence how and when the obligation will be satisfied.
  Those various parameters are together referred to as Credit Terms.
  Each Party states the Credit Terms it extends to the other Party: terms stated by the Vendor apply to credit issued by the Client, and terms stated by the Client apply to credit issued by the Vendor, in such cases where the Tally develops a negative balance.
  A Party's Credit Terms are recorded in the Tally Data and digitally signed by the Party stating them, and the Credit Terms in force when the Tally is signed form part of the Agreement.
  In such cases where a particular Credit Term is not explicitly included in the Tally Data, the default value for that term, as listed below, shall apply.
  Amounts are stated in the Denomination of the Tally.
  These various credit terms are defined in the Tally Data by the property name shown in parentheses and are interpreted as follows:
sections:
  - title: "Credit Limit (CreditLimit); Default: 0"
    text: >-
      This indicates the largest amount the Issuer can rely on becoming indebted to the Recipient.
      There is nothing in this limit that prevents the Issuer from making pledges in excess of this amount but the Recipient is not obligated to accept such excess as payment for Product.
  - title: "Call Notice (CallDays); Default: unspecified"
    text: >-
      The number of days notice required to be given by the Recipient to the Issuer before the balance of principal and/or accrued interest can be called due and payable.
      If not specified, the Issuer has no obligation to reduce principal any faster than is indicated by the Minimum Payment.
      Call terms can be changed at any time by either Party, but never in such a way as to limit the Issuer's rights under the Tally.
      For example, when reducing the call from 120 to 30, the effective terms will still be 120 until that period of time has first elapsed, after which the new call period will become effective.
  - title: "Security (lien); Default: None"
    text: >-
      This specifies any assets that are offered by the Issuer as collateral against amounts owed under the Agreement.
      It can contain one or more references to assets understood by the Parties including, but not limited to, recorded trust deeds, UCC liens, titles, serial numbers or model numbers.
      Leaving this property unspecified implies a personal (or corporate where applicable) guaranty of the amount owing with full recourse against any assets of the Issuer.
  - title: "Rate (rate); Default: 0"
    text: >-
      An annualized rate of interest expressed as a positive floating point number.
      For example, 0.05 means 5% per annum.
      No interest accrues on the balance unless a Rate is expressly stated.
      Where stated, this number will be scaled to match the Compound Interval in order to compute the interest/dividend charges to be applied during an interval.
  - title: "Compound Interval (period); Default: Monthly"
    text: >-
      The interval of time that passes before interest may be calculated and applied to the outstanding balance.
      Such calculations are expected to be performed by the Recipient and provided to the Issuer where applicable.
      For amortized balances, this also defines the regular payment interval.
  - title: "Grace Period (grace); Default: 30"
    text: >-
      New amounts of indebtedness will not accrue interest charges until this many days have passed.
  - title: "Maximum Paydown (mort); Default: No Maximum"
    text: >-
      This specifies the most the Issuer can pay down principal in advance of otherwise prevailing requirements and have its interest calculations reduced accordingly.
      This can be used to create a minimum interest return for a Recipient, while still allowing the Issuer to store value in the loan balance.
  - title: "Minimum Payment (pay); Default: no limit"
    text: >-
      The smallest amount the Issuer may pay down the balance at each Compound Interval period.
