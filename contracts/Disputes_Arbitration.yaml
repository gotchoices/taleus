# New for Taleus: binding arbitration, drafted jurisdiction-neutral for attorney review.
# Draft; not yet published.
stroc: '1.0'
language: en
title: Resolution of Disputes by Arbitration
author: sereus.org
text: >-
  The Parties intend that any dispute under this Agreement be resolved privately, without recourse to the courts of any particular country, state or other jurisdiction, as follows.
sections:
  - title: Negotiation
    text: >-
      A Party asserting a dispute shall first give the other Party written notice of it, according to the contact information contained in the Tally, and the Parties shall attempt in good faith to resolve it between themselves for a period of 30 days from that notice.
  - title: Binding Arbitration
    text: >-
      A dispute not resolved by negotiation shall be finally settled by binding arbitration before a single arbitrator.
      The Parties may agree on the arbitrator, the rules, the seat and the language of the arbitration; failing agreement within 30 days of a Party's written request for arbitration, the arbitration shall be conducted under the Arbitration Rules of the United Nations Commission on International Trade Law, with the arbitrator appointed as those rules provide, and the seat and language shall be those the arbitrator determines to be most convenient for the Parties.
      The arbitrator may conduct the proceedings by written submissions and remote hearing.
  - title: Award
    text: >-
      The award shall be in writing, shall be final and binding on the Parties, and may be entered and enforced in any court of competent jurisdiction.
      The arbitrator shall award the prevailing Party its actual damages incurred, plus all collection costs, including attorneys' fees and the costs of the arbitration.
  - title: Frivolous Claims
    text: >-
      Should any claim brought by one Party against the other be shown to be frivolous, or without basis, the award shall be increased to two times the actual damages incurred, plus all collection costs, including attorneys' fees.
  - title: Fraud
    text: >-
      When intentional fraud can be proven in a dispute between the Parties, the award shall be increased to three times the actual damages incurred, plus all collection costs, including attorneys' fees.
  - title: Interim Relief
    text: >-
      Nothing in this section prevents a Party from seeking from any court of competent jurisdiction interim relief to preserve collateral or evidence, or to enforce an award.
